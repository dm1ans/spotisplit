<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gender Split Dashboard</title>

<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Bebas+Neue&display=swap" rel="stylesheet">

<style>
body { margin:0; background:#0a0a0a; color:#eaeaea; font-family:DM Mono; }
.app { max-width:1100px; margin:auto; padding:40px; }
h1 { font-family:Bebas Neue; font-size:64px; }

.panel {
  background:#111;
  padding:20px;
  border:1px solid #222;
  margin-bottom:20px;
}

button {
  background:#1db954;
  border:none;
  padding:12px;
  cursor:pointer;
  margin-top:10px;
}

.grid {
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
}

.card {
  background:#111;
  padding:12px;
  border:1px solid #222;
}

.small { font-size:12px; color:#888; }

.bar { height:6px; background:#222; margin-top:6px; }
.fill { height:100%; background:#1db954; width:0%; }
</style>
</head>

<body>

<div class="app">

<h1>GENDER SPLIT</h1>

<div class="panel" id="auth">
  <input id="clientId" placeholder="Spotify Client ID" style="width:100%;padding:10px;">
  <button onclick="login()">Conectar</button>
  <div id="status"></div>
</div>

<div id="dashboard" style="display:none">

  <div>
    <button onclick="analyzeTop('short_term')">Último mes</button>
    <button onclick="analyzeTop('medium_term')">6 meses</button>
    <button onclick="analyzeTop('long_term')">1 año</button>
  </div>

  <div style="margin-top:10px;">
    <button onclick="analyzeLiked()">Me gusta</button>
  </div>

  <div id="progress" class="small"></div>

  <div class="grid" id="results"></div>

</div>

</div>

<script>

/* =========================
   STATE
========================= */

const state = {
  token: null,
  cache: new Map()
};

/* =========================
   CONFIG
========================= */

const REDIRECT_URI =
  "https://dm1ans.github.io/spotisplit/spotify-gender-analyzer.html";

const SCOPES =
  "user-top-read user-library-read user-read-private";

/* =========================
   LOGIN PKCE
========================= */

async function login() {

  const clientId = document.getElementById("clientId").value;
  localStorage.setItem("cid", clientId);

  const verifier = cryptoRandom();
  const challenge = await sha256(verifier);

  localStorage.setItem("verifier", verifier);

  const params = new URLSearchParams({
    client_id: clientId,
    response_type: "code",
    redirect_uri: REDIRECT_URI,
    scope: SCOPES,
    code_challenge_method: "S256",
    code_challenge: challenge
  });

  window.location.href =
    "https://accounts.spotify.com/authorize?" + params;
}

/* =========================
   CALLBACK
========================= */

window.onload = async () => {

  const code = new URLSearchParams(location.search).get("code");

  if (code) {

    const token = await exchange(code);

    state.token = token;
    window.token = token;

    document.getElementById("auth").style.display = "none";
    document.getElementById("dashboard").style.display = "block";

    setStatus("Conectado");
  }
};

/* =========================
   SPOTIFY API
========================= */

async function api(path) {

  const r = await fetch("https://api.spotify.com/v1" + path, {
    headers: { Authorization: "Bearer " + state.token }
  });

  return r.json();
}

/* =========================
   TOP ARTISTS (FILTRO TIEMPO)
========================= */

async function analyzeTop(range) {

  setProgress("Cargando top artistas...");

  const data = await api(`/me/top/artists?limit=50&time_range=${range}`);

  const classified = await classifyBatch(data.items);

  render(classified);
}

/* =========================
   LIKED SONGS (POR FECHA)
========================= */

async function analyzeLiked() {

  setProgress("Cargando me gusta...");

  let offset = 0;
  let all = [];
  let stop = false;

  while (!stop) {

    const data = await api(`/me/tracks?limit=50&offset=${offset}`);

    for (const item of data.items) {

      all.push({
        name: item.track.artists[0].name
      });
    }

    offset += 50;

    if (!data.next || offset > 500) stop = true;
  }

  const classified = await classifyBatch(all);

  render(classified);
}

/* =========================
   BATCH OPTIMIZADO
========================= */

async function classifyBatch(list) {

  const out = [];

  for (let i = 0; i < list.length; i++) {

    setProgress(`Analizando ${i+1}/${list.length}`);

    out.push(await classify(list[i].name));
  }

  return out;
}

/* =========================
   CLASSIFICATION PIPELINE
========================= */

async function classify(name) {

  const key = name.toLowerCase();

  if (state.cache.has(key))
    return state.cache.get(key);

  let gender = await musicbrainz(name);

  if (gender === "unknown") {
    gender = spotifyFallback(name);
  }

  const res = { name, gender };

  state.cache.set(key, res);

  return res;
}

/* =========================
   MUSICBRAINZ
========================= */

async function musicbrainz(name) {

  try {

    const url =
      `https://musicbrainz.org/ws/2/artist/?query=artist:"${encodeURIComponent(name)}"&fmt=json&limit=1`;

    const r = await fetch(url, {
      headers: { "User-Agent": "GenderSplitApp/1.0" }
    });

    const d = await r.json();

    await wait(1000);

    const a = d.artists?.[0];

    if (!a) return "unknown";

    if (a.type === "Group") return "group";
    if (a.gender === "male") return "male";
    if (a.gender === "female") return "female";

    return "unknown";

  } catch {
    return "unknown";
  }
}

/* =========================
   SPOTIFY FALLBACK
========================= */

function spotifyFallback(name) {

  const n = name.toLowerCase();

  const female = ["adele","rihanna","billie","beyonce","rosalia"];
  const male = ["drake","eminem","kanye","post","kendrick"];

  if (female.some(x => n.includes(x))) return "female";
  if (male.some(x => n.includes(x))) return "male";

  return "unknown";
}

/* =========================
   RENDER
========================= */

function render(list) {

  const el = document.getElementById("results");

  el.innerHTML = "";

  const count = { male:0, female:0, group:0, unknown:0 };

  list.forEach(a => count[a.gender]++);

  for (let k in count) {

    const pct = Math.round(count[k] / list.length * 100);

    el.innerHTML += `
      <div class="card">
        <div>${k}</div>
        <div class="small">${count[k]} artistas</div>
        <div class="bar"><div class="fill" style="width:${pct}%"></div></div>
      </div>
    `;
  }
}

/* =========================
   TOKEN EXCHANGE
========================= */

async function exchange(code){

  const cid = localStorage.getItem("cid");
  const verifier = localStorage.getItem("verifier");

  const body = new URLSearchParams({
    client_id: cid,
    grant_type:"authorization_code",
    code,
    redirect_uri: REDIRECT_URI,
    code_verifier: verifier
  });

  const r = await fetch("https://accounts.spotify.com/api/token", {
    method:"POST",
    headers:{ "Content-Type":"application/x-www-form-urlencoded" },
    body
  });

  const j = await r.json();

  return j.access_token;
}

/* =========================
   HELPERS
========================= */

function setProgress(t){ document.getElementById("progress").innerText = t; }
function setStatus(t){ document.getElementById("status").innerText = t; }
function wait(ms){ return new Promise(r=>setTimeout(r,ms)); }

function cryptoRandom(){
  return [...crypto.getRandomValues(new Uint8Array(64))]
    .map(x=>x.toString(16)).join("");
}

async function sha256(v){
  const b = new TextEncoder().encode(v);
  const d = await crypto.subtle.digest("SHA-256", b);
  return btoa(String.fromCharCode(...new Uint8Array(d)))
    .replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
}

</script>

</body>
</html>
