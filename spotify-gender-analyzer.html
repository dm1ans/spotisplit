<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Gender Split Fix v10</title>

<style>
body { margin:0; background:#0a0a0a; color:#eee; font-family:system-ui; }
.app { max-width:900px; margin:auto; padding:30px; }

h2 { margin-bottom:10px; }

input { width:100%; padding:10px; margin-bottom:10px; }

button { padding:10px; margin:5px 0; cursor:pointer; }

.grid { display:grid; grid-template-columns:repeat(2,1fr); gap:10px; }

.card { background:#111; border:1px solid #222; padding:10px; }

.counter { display:flex; gap:10px; flex-wrap:wrap; margin:10px 0; }

.counter div { border:1px solid #222; padding:6px 10px; }

.small { font-size:12px; opacity:.7; }
</style>
</head>

<body>

<div class="app">

<h2>Gender Split Fix v10</h2>

<input id="client" placeholder="Spotify Client ID"/>
<button onclick="login()">Login Spotify</button>

<div id="status"></div>

<div id="dash" style="display:none">

  <button onclick="run('short_term')">1 mes</button>
  <button onclick="run('medium_term')">6 meses</button>
  <button onclick="run('long_term')">1 año</button>

  <div class="counter" id="counter"></div>
  <div class="grid" id="grid"></div>

</div>

</div>

<script>

/* ================= STATE ================= */

const state = {
  token: null,
  counts: { female:0, male:0, group:0, unknown:0 }
};

/* ================= CONFIG ================= */

const REDIRECT_URI = "https://dm1ans.github.io/spotisplit/spotify-gender-analyzer.html";

/* ================= PKCE ================= */

function randomString(len){
  const arr = new Uint8Array(len);
  crypto.getRandomValues(arr);
  return btoa(String.fromCharCode(...arr))
    .replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')
    .slice(0,len);
}

async function sha256(str){
  const enc = new TextEncoder().encode(str);
  const buf = await crypto.subtle.digest("SHA-256", enc);
  return btoa(String.fromCharCode(...new Uint8Array(buf)))
    .replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}

/* ================= LOGIN ================= */

async function login(){

  const cid = document.getElementById("client").value.trim();
  if(!cid) return alert("Falta Client ID");

  localStorage.setItem("cid",cid);

  const verifier = randomString(64);
  localStorage.setItem("verifier",verifier);

  const challenge = await sha256(verifier);

  const url =
    "https://accounts.spotify.com/authorize" +
    "?client_id=" + cid +
    "&response_type=code" +
    "&redirect_uri=" + encodeURIComponent(REDIRECT_URI) +
    "&scope=user-top-read user-library-read" +
    "&code_challenge_method=S256" +
    "&code_challenge=" + challenge;

  location.href = url;
}

/* ================= CALLBACK ================= */

window.onload = async () => {

  const code = new URLSearchParams(location.search).get("code");
  if(!code) return;

  const cid = localStorage.getItem("cid");
  const verifier = localStorage.getItem("verifier");

  const body = new URLSearchParams();
  body.append("client_id", cid);
  body.append("grant_type", "authorization_code");
  body.append("code", code);
  body.append("redirect_uri", REDIRECT_URI);
  body.append("code_verifier", verifier);

  try {

    const r = await fetch("https://accounts.spotify.com/api/token", {
      method:"POST",
      headers:{ "Content-Type":"application/x-www-form-urlencoded" },
      body
    });

    const data = await r.json();

    console.log("TOKEN:", data);

    if(!r.ok || !data.access_token){
      document.getElementById("status").innerText =
        "Error login Spotify: " + (data.error || "unknown");
      return;
    }

    state.token = data.access_token;

    history.replaceState({},document.title,location.pathname);

    document.getElementById("dash").style.display="block";
    document.getElementById("status").innerText="Conectado";

  } catch(e){
    console.error(e);
    document.getElementById("status").innerText="Error network";
  }
};

/* ================= API ================= */

async function api(url){
  const r = await fetch("https://api.spotify.com/v1"+url,{
    headers:{ Authorization:"Bearer "+state.token }
  });

  return r.json();
}

/* ================= RUN (PAGINATED) ================= */

async function run(range){

  state.counts = { female:0, male:0, group:0, unknown:0 };

  document.getElementById("grid").innerHTML = "";

  let offset = 0;
  const limit = 50;
  let all = [];

  while(true){

    const data = await api(
      `/me/top/artists?limit=${limit}&offset=${offset}&time_range=${range}`
    );

    if(!data.items || data.items.length === 0) break;

    all = all.concat(data.items);

    offset += limit;

    if(data.items.length < limit) break;
  }

  for(const a of all){

    const g = classify(a.name, a);

    state.counts[g]++;

    render(a.name, g);
    update();
  }
}

/* ================= CLASSIFIER ================= */

function classify(name, artist){

  const n = name.toLowerCase().replace(/\s+/g," ");

  const female = [
    "billie","adele","rihanna","rosalia","dua lipa",
    "sza","lorde","miley","ariana","shakira","lizzo"
  ];

  const male = [
    "drake","eminem","kendrick","kanye","post malone",
    "the weeknd","frank ocean","travis scott","bad bunny"
  ];

  if(female.some(x => n.includes(x))) return "female";
  if(male.some(x => n.includes(x))) return "male";

  // group heuristics
  if(n.includes("&") || n.includes(" and ")) return "group";

  if(artist && artist.genres && artist.genres.length > 2)
    return "group";

  return "unknown";
}

/* ================= UI ================= */

function render(name, g){

  const el = document.getElementById("grid");

  const d = document.createElement("div");
  d.className = "card";

  d.innerHTML = `
    <div>${name}</div>
    <div class="small">${g}</div>
  `;

  el.appendChild(d);
}

function update(){

  const c = state.counts;

  document.getElementById("counter").innerHTML = `
    <div>♀ ${c.female}</div>
    <div>♂ ${c.male}</div>
    <div>👥 ${c.group}</div>
    <div>? ${c.unknown}</div>
  `;
}

</script>

</body>
</html>
