<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gender Split — Spotify</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Bebas+Neue&display=swap" rel="stylesheet">

<style>
/* ======================
   UI BASE (SIMPLIFICADO)
====================== */

body {
  margin:0;
  font-family:'DM Mono', monospace;
  background:#0a0a0a;
  color:#e8e8e8;
}

.app {
  max-width:900px;
  margin:0 auto;
  padding:40px;
}

h1 {
  font-family:'Bebas Neue', sans-serif;
  font-size:64px;
  margin-bottom:20px;
}

.panel {
  background:#111;
  border:1px solid #222;
  padding:20px;
}

input {
  width:100%;
  padding:12px;
  background:#000;
  border:1px solid #333;
  color:#fff;
}

button {
  margin-top:12px;
  padding:12px;
  background:#1db954;
  border:none;
  cursor:pointer;
  font-weight:bold;
}

#errorMsg {
  color:red;
  margin-top:15px;
}

#loading {
  display:none;
  margin-top:15px;
  color:#1db954;
}
</style>
</head>

<body>

<div class="app">

<h1>GENDER SPLIT</h1>

<div class="panel">

  <input id="clientIdInput" placeholder="Spotify Client ID">

  <button onclick="handleLogin()">Conectar con Spotify</button>

  <div id="loading">Conectando con Spotify...</div>
  <div id="errorMsg"></div>

</div>

</div>

<script>

// ======================
// CONFIG FIJA
// ======================

const REDIRECT_URI =
  "https://dm1ans.github.io/spotisplit/spotify-gender-analyzer.html";

const SCOPES = [
  "user-library-read",
  "user-top-read",
  "user-read-private",
  "user-read-email"
].join(" ");

let accessToken = null;

// ======================
// INIT (callback OAuth)
// ======================

window.addEventListener("load", async () => {

  const params = new URLSearchParams(window.location.search);
  const code = params.get("code");
  const error = params.get("error");

  if (error) {
    showError(error);
    return;
  }

  if (code) {
    try {
      showLoading();

      await exchangeCodeForToken(code);

      // limpia URL
      window.history.replaceState({}, document.title, REDIRECT_URI);

      hideLoading();

      console.log("LOGIN OK");
      await onLogin();

    } catch (e) {
      console.error(e);
      hideLoading();
      showError("Error autenticando con Spotify");
    }
  }
});

// ======================
// LOGIN
// ======================

async function handleLogin() {

  const clientId = document.getElementById("clientIdInput").value.trim();

  if (!clientId) {
    showError("Falta Client ID");
    return;
  }

  localStorage.setItem("client_id", clientId);

  const verifier = generateVerifier();
  const challenge = await generateChallenge(verifier);

  localStorage.setItem("verifier", verifier);

  const params = new URLSearchParams({
    client_id: clientId,
    response_type: "code",
    redirect_uri: REDIRECT_URI,
    scope: SCOPES,
    code_challenge_method: "S256",
    code_challenge: challenge
  });

  window.location.href =
    "https://accounts.spotify.com/authorize?" + params.toString();
}

// ======================
// TOKEN EXCHANGE
// ======================

async function exchangeCodeForToken(code) {

  const clientId = localStorage.getItem("client_id");
  const verifier = localStorage.getItem("verifier");

  const body = new URLSearchParams({
    client_id: clientId,
    grant_type: "authorization_code",
    code: code,
    redirect_uri: REDIRECT_URI,
    code_verifier: verifier
  });

  const res = await fetch("https://accounts.spotify.com/api/token", {
    method: "POST",
    headers: {
      "Content-Type": "application/x-www-form-urlencoded"
    },
    body
  });

  const data = await res.json();

  if (!res.ok) {
    console.log(data);
    throw new Error("Token error");
  }

  accessToken = data.access_token;
}

// ======================
// POST LOGIN
// ======================

async function onLogin() {

  document.querySelector(".panel").innerHTML =
    "<h2>Login correcto</h2><p>Cargando datos de Spotify...</p>";

  try {
    // 1. Usuario
    const me = await fetch("https://api.spotify.com/v1/me", {
      headers: {
        Authorization: "Bearer " + accessToken
      }
    }).then(r => r.json());

    // 2. Top artistas (esto ya te abre el camino a tu app)
    const topArtists = await fetch(
      "https://api.spotify.com/v1/me/top/artists?limit=10",
      {
        headers: {
          Authorization: "Bearer " + accessToken
        }
      }
    ).then(r => r.json());

    console.log("USER:", me);
    console.log("TOP ARTISTS:", topArtists);

    // 3. Mostrar en pantalla
    document.querySelector(".panel").innerHTML = `
      <h2>Login correcto</h2>
      <p><b>${me.display_name || me.id}</b></p>
      <p>Top artistas cargados: ${topArtists.items.length}</p>
    `;

  } catch (e) {
    console.error(e);
    document.querySelector(".panel").innerHTML =
      "<h2>Error cargando datos de Spotify</h2>";
  }
}

// ======================
// UI HELPERS
// ======================

function showLoading() {
  document.getElementById("loading").style.display = "block";
}

function hideLoading() {
  document.getElementById("loading").style.display = "none";
}

function showError(msg) {
  document.getElementById("errorMsg").innerText = msg;
}

// ======================
// PKCE
// ======================

function generateVerifier() {
  const chars =
    "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789";
  let str = "";
  for (let i = 0; i < 64; i++) {
    str += chars[Math.floor(Math.random() * chars.length)];
  }
  return str;
}

async function generateChallenge(verifier) {
  const data = new TextEncoder().encode(verifier);
  const digest = await crypto.subtle.digest("SHA-256", data);

  return btoa(String.fromCharCode(...new Uint8Array(digest)))
    .replace(/\+/g, "-")
    .replace(/\//g, "_")
    .replace(/=+$/, "");
}

</script>

</body>
</html>
