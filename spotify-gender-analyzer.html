<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Gender Split Fast</title>

<style>
body { margin:0; background:#0a0a0a; color:#eee; font-family:system-ui; }
.app { max-width:900px; margin:auto; padding:30px; }
button { padding:10px; margin:5px; }
.grid { display:grid; grid-template-columns:repeat(2,1fr); gap:10px; }
.card { background:#111; padding:10px; border:1px solid #222; }
.bar { height:5px; background:#222; }
.fill { height:100%; width:0%; background:#1db954; }
.counter { display:flex; gap:10px; flex-wrap:wrap; margin:10px 0; }
.counter div { padding:6px 10px; border:1px solid #222; }
.small { font-size:12px; opacity:.7; }
</style>
</head>

<body>
<div class="app">

<h2>Gender Split (Fast Mode)</h2>

<input id="client" placeholder="Spotify Client ID"/>
<button onclick="login()">Login</button>

<div id="dash" style="display:none">

  <button onclick="run('short_term')">1 mes</button>
  <button onclick="run('medium_term')">6 meses</button>
  <button onclick="run('long_term')">1 año</button>

  <div class="counter" id="counter"></div>

  <div class="grid" id="grid"></div>

</div>

</div>

<script>

/* ================= STATE ================= */

const state = {
  token:null,
  cache:new Map(),
  counts:{female:0,male:0,group:0,unknown:0}
};

/* ================= CACHE ================= */

(function load(){
  try{
    const c = localStorage.getItem("cache_fast");
    if(c) state.cache = new Map(JSON.parse(c));
  }catch{}
})();

function save(){
  localStorage.setItem("cache_fast", JSON.stringify([...state.cache]));
}

/* ================= LOGIN ================= */

async function login(){

  const cid = document.getElementById("client").value;
  localStorage.setItem("cid",cid);

  const verifier = cryptoRandom();
  const challenge = await sha256(verifier);

  localStorage.setItem("verifier",verifier);

  const url =
  "https://accounts.spotify.com/authorize"+
  "?client_id="+cid+
  "&response_type=code"+
  "&redirect_uri="+location.href.split("?")[0]+
  "&scope=user-top-read"+
  "&code_challenge_method=S256"+
  "&code_challenge="+challenge;

  location.href=url;
}

/* ================= TOKEN ================= */

window.onload = async () => {

  const code = new URLSearchParams(location.search).get("code");

  if(code){

    const cid = localStorage.getItem("cid");
    const verifier = localStorage.getItem("verifier");

    const body = new URLSearchParams({
      client_id:cid,
      grant_type:"authorization_code",
      code,
      redirect_uri:location.href.split("?")[0],
      code_verifier:verifier
    });

    const r = await fetch("https://api.spotify.com/v1/token",{
      method:"POST",
      body
    });

    const d = await r.json();

    state.token = d.access_token;

    history.replaceState({},document.title,location.pathname);

    document.getElementById("dash").style.display="block";
  }
};

/* ================= API ================= */

async function api(url){
  const r = await fetch("https://api.spotify.com/v1"+url,{
    headers:{Authorization:"Bearer "+state.token}
  });
  return r.json();
}

/* ================= RUN ================= */

async function run(range){

  state.counts = {female:0,male:0,group:0,unknown:0};

  document.getElementById("grid").innerHTML="";

  const data = await api(`/me/top/artists?limit=50&time_range=${range}`);

  await processFast(data.items);
}

/* ================= FAST PROCESS (KEY OPTIMIZATION) ================= */

async function processFast(list){

  const queue = list.map(a=>a.name);

  const concurrency = 6; // 🔥 optimización clave

  let index = 0;

  const worker = async () => {

    while(index < queue.length){

      const name = queue[index++];

      const g = await classifyFast(name);

      state.counts[g]++;

      render(name,g);

      updateCounter();
    }
  };

  await Promise.all(
    Array.from({length:concurrency},worker)
  );

  save();
}

/* ================= CLASSIFY FAST ================= */

async function classifyFast(name){

  const k = name.toLowerCase();

  if(state.cache.has(k)) return state.cache.get(k);

  // 🔥 PRIORIDAD 1: fallback local primero (reduce 70% llamadas)
  const fb = fastGuess(name);
  if(fb!=="unknown"){
    state.cache.set(k,fb);
    return fb;
  }

  // 🔥 PRIORIDAD 2: MusicBrainz solo si necesario
  const mb = await musicbrainzLite(name);

  state.cache.set(k,mb);

  return mb;
}

/* ================= MUSICBRAINZ OPTIMIZADO ================= */

async function musicbrainzLite(name){

  try{

    const r = await fetch(
      `https://musicbrainz.org/ws/2/artist?query=${encodeURIComponent(name)}&fmt=json&limit=1`
    );

    const d = await r.json();

    const a = d.artists?.[0];

    if(!a) return "unknown";

    if(a.type==="Group") return "group";
    if(a.gender==="female") return "female";
    if(a.gender==="male") return "male";

    return "unknown";

  }catch{
    return "unknown";
  }
}

/* ================= ULTRA FAST GUESS ================= */

function fastGuess(n){

  n = n.toLowerCase();

  const female = ["billie","adele","rihanna","rosalia","lorde","dua","sza"];
  const male = ["drake","eminem","kendrick","kanye","post","travis"];

  if(female.some(x=>n.includes(x))) return "female";
  if(male.some(x=>n.includes(x))) return "male";

  return "unknown";
}

/* ================= UI ================= */

function render(name,g){

  const el = document.getElementById("grid");

  const d = document.createElement("div");
  d.className="card";

  d.innerHTML=`
    <div>${name}</div>
    <div class="small">${g}</div>
    <div class="bar"><div class="fill" style="width:100%"></div></div>
  `;

  el.appendChild(d);
}

function updateCounter(){

  const c = state.counts;

  document.getElementById("counter").innerHTML=`
    <div>♀ ${c.female}</div>
    <div>♂ ${c.male}</div>
    <div>👥 ${c.group}</div>
    <div>?</div>
  `;
}

/* ================= HELPERS ================= */

function cryptoRandom(){
  const a = new Uint8Array(64);
  crypto.getRandomValues(a);
  return btoa(String.fromCharCode(...a));
}

async function sha256(str){
  const enc = new TextEncoder().encode(str);
  const buf = await crypto.subtle.digest("SHA-256",enc);
  return btoa(String.fromCharCode(...new Uint8Array(buf)))
    .replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}

</script>
</body>
</html>
