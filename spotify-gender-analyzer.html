<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gender Split Dashboard</title>

<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Bebas+Neue&display=swap" rel="stylesheet">

<style>
body { margin:0; background:#0a0a0a; color:#eaeaea; font-family:DM Mono; }
.app { max-width:1100px; margin:auto; padding:40px; }

h1 { font-family:Bebas Neue; font-size:64px; }

.panel { background:#111; padding:20px; border:1px solid #222; margin-bottom:20px; }

button {
  background:#1db954;
  border:none;
  padding:12px;
  cursor:pointer;
  margin-top:10px;
}

.progress {
  margin:10px 0;
  font-size:12px;
  color:#aaa;
}

/* GRID */
.grid {
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
}

/* CARD */
.card {
  background:#111;
  padding:12px;
  border:1px solid #222;
  min-height:60px;
}

/* SKELETON */
.skeleton {
  background:linear-gradient(90deg,#111,#1a1a1a,#111);
  background-size:200% 100%;
  animation:shimmer 1.2s infinite;
  height:14px;
  margin:6px 0;
  border-radius:4px;
}

@keyframes shimmer {
  0% { background-position:200% 0; }
  100% { background-position:-200% 0; }
}

/* BAR */
.bar {
  height:6px;
  background:#222;
  margin-top:6px;
  overflow:hidden;
}

.fill {
  height:100%;
  background:#1db954;
  width:0%;
  transition:width .3s;
}

/* COUNTER */
.counter {
  display:flex;
  gap:10px;
  margin:15px 0;
  flex-wrap:wrap;
}

.counter div {
  font-size:12px;
  padding:6px 10px;
  border:1px solid #222;
  background:#111;
}
</style>
</head>

<body>

<div class="app">

<h1>GENDER SPLIT</h1>

<div class="panel">
  <input id="clientId" placeholder="Spotify Client ID" style="width:100%;padding:10px;">
  <button onclick="login()">Conectar</button>
  <div id="status"></div>
</div>

<div id="dashboard" style="display:none">

  <button onclick="analyze('short_term')">Último mes</button>
  <button onclick="analyze('medium_term')">6 meses</button>
  <button onclick="analyze('long_term')">1 año</button>

  <div class="progress" id="progressText"></div>

  <!-- COUNTERS LIVE -->
  <div class="counter" id="counter">
    <div>Mujer: 0</div>
    <div>Hombre: 0</div>
    <div>Grupo: 0</div>
    <div>Unknown: 0</div>
  </div>

  <div class="grid" id="results"></div>

</div>

</div>

<script>

/* =========================
   STATE
========================= */

const state = {
  token: null,
  cache: new Map(),
  counts: {
    female:0,
    male:0,
    group:0,
    unknown:0
  }
};

/* =========================
   CACHE PERSISTENTE
========================= */

function loadCache() {
  try {
    const raw = localStorage.getItem("gender_cache");
    if (raw) state.cache = new Map(JSON.parse(raw));
  } catch {}
}

function saveCache() {
  localStorage.setItem(
    "gender_cache",
    JSON.stringify(Array.from(state.cache.entries()))
  );
}

loadCache();

/* =========================
   LOGIN
========================= */

function login() {
  const cid = document.getElementById("clientId").value;
  localStorage.setItem("cid", cid);

  const redirect = location.href.split("?")[0];

  const url =
    "https://accounts.spotify.com/authorize" +
    "?client_id=" + cid +
    "&response_type=token" +
    "&redirect_uri=" + encodeURIComponent(redirect) +
    "&scope=user-top-read user-library-read";

  window.location.href = url;
}

/* =========================
   TOKEN
========================= */

window.onload = () => {

  const hash = location.hash;

  if (hash.includes("access_token")) {

    state.token = new URLSearchParams(hash.substring(1)).get("access_token");

    document.getElementById("dashboard").style.display = "block";

    setStatus("Conectado");
  }
};

function setStatus(t){
  document.getElementById("status").innerText = t;
}

/* =========================
   SPOTIFY API
========================= */

async function api(path) {
  const r = await fetch("https://api.spotify.com/v1" + path, {
    headers: { Authorization: "Bearer " + state.token }
  });

  return r.json();
}

/* =========================
   ANALYSIS
========================= */

async function analyze(range) {

  state.counts = { female:0, male:0, group:0, unknown:0 };

  updateCounter();

  document.getElementById("results").innerHTML = "";

  showSkeleton(12);

  const data = await api(`/me/top/artists?limit=50&time_range=${range}`);

  const list = data.items.map(a => a.name);

  await classifyIncremental(list);
}

/* =========================
   SKELETON UI
========================= */

function showSkeleton(n) {

  const el = document.getElementById("results");
  el.innerHTML = "";

  for (let i=0;i<n;i++) {

    const div = document.createElement("div");
    div.className = "card";

    div.innerHTML = `
      <div class="skeleton" style="width:70%"></div>
      <div class="skeleton" style="width:40%"></div>
      <div class="skeleton" style="width:90%"></div>
    `;

    el.appendChild(div);
  }
}

/* =========================
   INCREMENTAL PIPELINE
========================= */

async function classifyIncremental(list) {

  const concurrency = 6;
  let index = 0;

  document.getElementById("results").innerHTML = "";

  async function worker() {

    while (index < list.length) {

      const i = index++;
      const name = list[i];

      setProgress(i, list.length);

      const gender = await classify(name);

      state.counts[gender]++;

      updateCounter();

      renderOne({ name, gender });

      await new Promise(r => requestAnimationFrame(r));
    }
  }

  await Promise.all(
    Array.from({ length: concurrency }, worker)
  );

  saveCache();
}

/* =========================
   CLASSIFY
========================= */

async function classify(name) {

  const key = name.toLowerCase();

  if (state.cache.has(key)) {
    return state.cache.get(key);
  }

  let g = await musicbrainz(name);

  if (g === "unknown") {
    g = spotifyFallback(name);
  }

  state.cache.set(key, g);

  return g;
}

/* =========================
   MUSICBRAINZ
========================= */

async function musicbrainz(name) {

  try {

    const url =
      `https://musicbrainz.org/ws/2/artist/?query=artist:"${encodeURIComponent(name)}"&fmt=json&limit=1`;

    const r = await fetch(url, {
      headers: { "User-Agent": "GenderSplitApp" }
    });

    const d = await r.json();

    await wait(900);

    const a = d.artists?.[0];

    if (!a) return "unknown";

    if (a.type === "Group") return "group";
    if (a.gender === "male") return "male";
    if (a.gender === "female") return "female";

    return "unknown";

  } catch {
    return "unknown";
  }
}

/* =========================
   FALLBACK
========================= */

function spotifyFallback(name) {

  const n = name.toLowerCase();

  const female = ["billie","adele","rihanna","rosalia","beyonce"];
  const male = ["drake","eminem","kendrick","kanye","post"];

  if (female.some(x => n.includes(x))) return "female";
  if (male.some(x => n.includes(x))) return "male";

  return "unknown";
}

/* =========================
   RENDER
========================= */

function renderOne(item) {

  const el = document.getElementById("results");

  const div = document.createElement("div");
  div.className = "card";

  div.innerHTML = `
    <div>${item.name}</div>
    <div class="small">${item.gender}</div>
    <div class="bar"><div class="fill" style="width:100%"></div></div>
  `;

  el.appendChild(div);
}

/* =========================
   COUNTER LIVE
========================= */

function updateCounter() {

  const c = state.counts;

  document.getElementById("counter").innerHTML = `
    <div>Mujer: ${c.female}</div>
    <div>Hombre: ${c.male}</div>
    <div>Grupo: ${c.group}</div>
    <div>Unknown: ${c.unknown}</div>
  `;
}

/* =========================
   PROGRESS
========================= */

function setProgress(i, total) {
  document.getElementById("progressText").innerText =
    `Analizando ${i + 1} / ${total}`;
}

/* =========================
   HELPERS
========================= */

function wait(ms){
  return new Promise(r => setTimeout(r, ms));
}

</script>

</body>
</html>
