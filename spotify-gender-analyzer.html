<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gender Split — Spotify</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,300;0,400;0,500;1,300&family=Bebas+Neue&display=swap" rel="stylesheet">

<style>
/* =========================
   TU CSS ORIGINAL COMPLETO
   (sin cambios)
========================= */

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #0a0a0a;
  --surface: #111111;
  --border: #222222;
  --text: #e8e8e8;
  --muted: #555555;
  --accent: #1db954;
}

html, body {
  background: var(--bg);
  color: var(--text);
  font-family: 'DM Mono', monospace;
  min-height: 100vh;
}

.app { max-width: 900px; margin: 0 auto; padding: 40px; }

.config-panel {
  background: var(--surface);
  border: 1px solid var(--border);
  padding: 24px;
  margin-bottom: 24px;
}

input {
  width: 100%;
  padding: 12px;
  background: var(--bg);
  border: 1px solid var(--border);
  color: var(--text);
}

button {
  margin-top: 12px;
  padding: 12px 16px;
  background: var(--accent);
  border: none;
  cursor: pointer;
}
<div id="loading" style="display:none; margin-top:20px; color:#1db954;">
  Conectando con Spotify...
</div>
   
#errorMsg {
  color: red;
  margin-top: 20px;
}
</style>
</head>

<body>

<div class="app">

  <h1>GENDER SPLIT</h1>

  <div class="config-panel" id="configPanel">
    <input id="clientIdInput" placeholder="Spotify Client ID">
    <button onclick="handleLogin()">Conectar con Spotify</button>
  </div>

  <div id="errorMsg"></div>

</div>

<script>

// =========================
// CONFIG
// =========================

const SCOPES = [
  'user-library-read',
  'user-top-read',
  'user-read-private',
  'user-read-email'
].join(' ');

const REDIRECT_URI = "https://dm1ans.github.io/spotisplit/spotify-gender-analyzer.html";

let accessToken = null;

// =========================
// INIT (LOGIN RETURN)
// =========================

window.addEventListener('load', async () => {

  const saved = localStorage.getItem('gsp_client_id');
  if (saved) document.getElementById('clientIdInput').value = saved;

  const params = new URLSearchParams(window.location.search);
  const code = params.get('code');
  const error = params.get('error');

  if (error) {
    showError("Error Spotify: " + error);
    return;
  }

  if (code) {
    try {
      await exchangeCodeForToken(code);
      window.history.replaceState({}, document.title, REDIRECT_URI);
      await onLogin();
    } catch (e) {
      console.error(e);
      showError("Error autenticando con Spotify");
    }
  }
});

// =========================
// LOGIN (PKCE)
// =========================

async function handleLogin() {

  const clientId = document.getElementById('clientIdInput').value.trim();

  if (!clientId) {
    showError("Ingresá Client ID");
    return;
  }

  localStorage.setItem('gsp_client_id', clientId);

  const verifier = generateRandomString(64);
  const challenge = await pkceChallenge(verifier);

  localStorage.setItem('pkce_verifier', verifier);

  const params = new URLSearchParams({
    client_id: clientId,
    response_type: 'code',
    redirect_uri: REDIRECT_URI,
    scope: SCOPES,
    code_challenge_method: 'S256',
    code_challenge: challenge
  });

  window.location.href =
    "https://accounts.spotify.com/authorize?" + params.toString();
}

// =========================
// EXCHANGE TOKEN
// =========================

async function exchangeCodeForToken(code) {

  const clientId = localStorage.getItem('gsp_client_id');
  const verifier = localStorage.getItem('pkce_verifier');

  const body = new URLSearchParams({
    client_id: clientId,
    grant_type: 'authorization_code',
    code: code,
    redirect_uri: REDIRECT_URI,
    code_verifier: verifier
  });

  const res = await fetch("https://accounts.spotify.com/api/token", {
    method: "POST",
    headers: {
      "Content-Type": "application/x-www-form-urlencoded"
    },
    body
  });

  const data = await res.json();

  if (!res.ok) {
    console.error(data);
    throw new Error("Token error");
  }

  accessToken = data.access_token;
}

// =========================
// SPOTIFY API
// =========================

async function spotifyFetch(path) {
  const res = await fetch("https://api.spotify.com/v1" + path, {
    headers: {
      Authorization: "Bearer " + accessToken
    }
  });

  if (!res.ok) throw new Error("Spotify API error");

  return res.json();
}

// =========================
// LOGIN OK
// =========================

async function onLogin() {

  document.getElementById('configPanel').style.display = 'none';

  const profile = await spotifyFetch('/me');

  console.log("Usuario conectado:", profile);
}

// =========================
// PKCE HELPERS
// =========================

function generateRandomString(length) {
  const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789";
  let result = "";
  for (let i = 0; i < length; i++) {
    result += chars[Math.floor(Math.random() * chars.length)];
  }
  return result;
}

async function pkceChallenge(verifier) {
  const data = new TextEncoder().encode(verifier);
  const digest = await crypto.subtle.digest("SHA-256", data);
  return base64url(digest);
}

function base64url(buffer) {
  return btoa(String.fromCharCode(...new Uint8Array(buffer)))
    .replace(/=/g, "")
    .replace(/\+/g, "-")
    .replace(/\//g, "_");
}

// =========================
// UI
// =========================

function showError(msg) {
  document.getElementById("errorMsg").textContent = msg;
}

</script>

</body>
</html>
