<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gender Split Dashboard</title>

<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Bebas+Neue&display=swap" rel="stylesheet">

<style>
body { margin:0; background:#0a0a0a; color:#eaeaea; font-family:DM Mono; }

.app { max-width:1100px; margin:auto; padding:40px; }

h1 { font-family:Bebas Neue; font-size:64px; }

.panel {
  background:#111;
  padding:20px;
  border:1px solid #222;
  margin-bottom:20px;
}

button {
  background:#1db954;
  border:none;
  padding:12px;
  cursor:pointer;
  margin-top:10px;
}

.grid {
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
}

.card {
  background:#111;
  padding:10px;
  border:1px solid #222;
}

.small { font-size:12px; color:#888; }

.bar {
  height:6px;
  background:#222;
  margin-top:6px;
}

.fill {
  height:100%;
  background:#1db954;
  width:0%;
}
</style>
</head>

<body>

<div class="app">

<h1>GENDER SPLIT DASHBOARD</h1>

<div class="panel" id="authPanel">
  <input id="clientId" placeholder="Spotify Client ID" style="width:100%;padding:10px;">
  <button onclick="login()">Conectar</button>
  <div id="status"></div>
</div>

<div id="dashboard" style="display:none">

  <button onclick="analyze()">Analizar biblioteca</button>

  <div id="progress" class="small"></div>

  <div class="grid" id="results"></div>

</div>

</div>

<script>

/* =========================
   STATE GLOBAL (DASHBOARD)
========================= */

const state = {
  token: null,
  artists: [],
  classified: [],
  cache: new Map()
};

/* =========================
   AUTH
========================= */

const REDIRECT_URI =
  "https://dm1ans.github.io/spotisplit/spotify-gender-analyzer.html";

const SCOPES = "user-top-read user-library-read user-read-private";

async function login() {

  const clientId = document.getElementById("clientId").value;
  localStorage.setItem("cid", clientId);

  const verifier = cryptoRandom();
  const challenge = await sha256(verifier);

  localStorage.setItem("verifier", verifier);

  const params = new URLSearchParams({
    client_id: clientId,
    response_type: "code",
    redirect_uri: REDIRECT_URI,
    scope: SCOPES,
    code_challenge_method: "S256",
    code_challenge: challenge
  });

  window.location.href =
    "https://accounts.spotify.com/authorize?" + params;
}

/* =========================
   INIT CALLBACK
========================= */

window.onload = async () => {

  const code = new URLSearchParams(location.search).get("code");

  if (code) {
    setStatus("Autenticando...");

    const token = await exchange(code);

    state.token = token;
    window.token = token;

    document.getElementById("authPanel").style.display = "none";
    document.getElementById("dashboard").style.display = "block";

    setStatus("Conectado");
  }
};

/* =========================
   SPOTIFY API
========================= */

async function api(path) {

  const r = await fetch("https://api.spotify.com/v1" + path, {
    headers: { Authorization: "Bearer " + state.token }
  });

  return r.json();
}

/* =========================
   ANALYSIS PIPELINE (OPTIMIZADO)
========================= */

async function analyze() {

  setProgress("Cargando artistas...");

  const data = await api("/me/top/artists?limit=30");

  state.artists = data.items;

  setProgress("Clasificando (optimizado)...");

  state.classified = await classifyBatch(state.artists);

  render(state.classified);
}

/* =========================
   PARALLEL CLASSIFIER (OPTIMIZADO)
========================= */

async function classifyBatch(list) {

  const concurrency = 5;
  const results = [];

  for (let i = 0; i < list.length; i += concurrency) {

    const batch = list.slice(i, i + concurrency);

    const resolved = await Promise.all(
      batch.map(a => classify(a.name))
    );

    results.push(...resolved);

    setProgress(`Procesando ${i + batch.length}/${list.length}`);
  }

  return results;
}

/* =========================
   MUSICBRAINZ CACHE
========================= */

async function classify(name) {

  const key = name.toLowerCase();

  if (state.cache.has(key)) return state.cache.get(key);

  const gender = await fakeMB(name);

  const res = { name, gender };

  state.cache.set(key, res);

  return res;
}

/* SIMULACIÓN OPTIMIZADA (puedes reconectar MB real después) */
async function fakeMB(name) {

  await wait(200); // simula latencia reducida

  const male = ["drake","eminem","kanye","post","kendrick"];
  const female = ["adele","rihanna","beyonce","billie"];

  const n = name.toLowerCase();

  if (male.some(x => n.includes(x))) return "male";
  if (female.some(x => n.includes(x))) return "female";

  return "unknown";
}

/* =========================
   RENDER DASHBOARD
========================= */

function render(list) {

  const el = document.getElementById("results");

  el.innerHTML = "";

  const count = { male:0, female:0, unknown:0 };

  list.forEach(a => count[a.gender]++);

  for (let k in count) {

    const pct = Math.round(count[k] / list.length * 100);

    el.innerHTML += `
      <div class="card">
        <div>${k}</div>
        <div class="small">${count[k]} artistas</div>
        <div class="bar"><div class="fill" style="width:${pct}%"></div></div>
      </div>
    `;
  }
}

/* =========================
   HELPERS
========================= */

function setStatus(t){ document.getElementById("status").innerText = t; }
function setProgress(t){ document.getElementById("progress").innerText = t; }
function wait(ms){ return new Promise(r=>setTimeout(r,ms)); }

function cryptoRandom(){
  return [...crypto.getRandomValues(new Uint8Array(64))]
    .map(x=>x.toString(16)).join("");
}

async function sha256(v){
  const b = new TextEncoder().encode(v);
  const d = await crypto.subtle.digest("SHA-256", b);
  return btoa(String.fromCharCode(...new Uint8Array(d)))
    .replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
}

/* =========================
   TOKEN EXCHANGE (REAL)
========================= */

async function exchange(code){

  const client_id = localStorage.getItem("cid");
  const verifier = localStorage.getItem("verifier");

  const body = new URLSearchParams({
    client_id,
    grant_type:"authorization_code",
    code,
    redirect_uri: REDIRECT_URI,
    code_verifier: verifier
  });

  const r = await fetch("https://accounts.spotify.com/api/token", {
    method:"POST",
    headers:{ "Content-Type":"application/x-www-form-urlencoded" },
    body
  });

  const j = await r.json();

  return j.access_token;
}

</script>

</body>
</html>
