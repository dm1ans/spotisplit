<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Gender Split Fix v10</title>

<style>
body { margin:0; background:#0a0a0a; color:#eee; font-family:system-ui; }
.app { max-width:900px; margin:auto; padding:30px; }

h2 { margin-bottom:10px; }

input { width:100%; padding:10px; margin-bottom:10px; }

button { padding:10px; margin:5px 0; cursor:pointer; }

.grid { display:grid; grid-template-columns:repeat(2,1fr); gap:10px; }

.card { background:#111; border:1px solid #222; padding:10px; }

.counter { display:flex; gap:10px; flex-wrap:wrap; margin:10px 0; }

.counter div { border:1px solid #222; padding:6px 10px; }

.small { font-size:12px; opacity:.7; }
</style>
</head>

<body>

<div class="app">

<h2>Gender Split Fix v10</h2>

<input id="client" placeholder="Spotify Client ID"/>
<button onclick="login()">Login Spotify</button>

<div id="status"></div>

<div id="dash" style="display:none">

  <button onclick="run('short_term')">1 mes</button>
  <button onclick="run('medium_term')">6 meses</button>
  <button onclick="run('long_term')">1 año</button>

  <div class="counter" id="counter"></div>
  <div class="grid" id="grid"></div>

</div>

</div>

<script>

/* ================= STATE ================= */

const state = {
  token: null,
  cache: new Map(),
  counts: { female:0, male:0, group:0, unknown:0 }
};

/* ================= CONFIG FIJA ================= */

const REDIRECT_URI = "https://dm1ans.github.io/spotisplit/spotify-gender-analyzer.html";

/* ================= HELPERS PKCE ================= */

function randomString(len){
  const arr = new Uint8Array(len);
  crypto.getRandomValues(arr);
  return btoa(String.fromCharCode(...arr))
    .replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')
    .slice(0,len);
}

async function sha256(str){
  const enc = new TextEncoder().encode(str);
  const buf = await crypto.subtle.digest("SHA-256", enc);
  return btoa(String.fromCharCode(...new Uint8Array(buf)))
    .replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}

/* ================= LOGIN ================= */

async function login(){

  const cid = document.getElementById("client").value.trim();
  if(!cid) return alert("Falta Client ID");

  localStorage.setItem("cid",cid);

  const verifier = randomString(64);
  localStorage.setItem("verifier",verifier);

  const challenge = await sha256(verifier);

  const url =
    "https://accounts.spotify.com/authorize" +
    "?client_id=" + cid +
    "&response_type=code" +
    "&redirect_uri=" + encodeURIComponent(REDIRECT_URI) +
    "&scope=user-top-read user-library-read" +
    "&code_challenge_method=S256" +
    "&code_challenge=" + challenge;

  location.href = url;
}

/* ================= CALLBACK ================= */

window.onload = async () => {

  const code = new URLSearchParams(location.search).get("code");

  if(!code) return;

  const cid = localStorage.getItem("cid");
  const verifier = localStorage.getItem("verifier");

  const body = new URLSearchParams({
    client_id: cid,
    grant_type: "authorization_code",
    code,
    redirect_uri: REDIRECT_URI,
    code_verifier: verifier
  });

  const r = await fetch("https://accounts.spotify.com/api/token", {
    method:"POST",
    headers: {
      "Content-Type":"application/x-www-form-urlencoded"
    },
    body
  });

  const data = await r.json();

  console.log("AUTH:", data);

  if(!data.access_token){
    document.getElementById("status").innerText =
      "Error login Spotify (mirar consola)";
    return;
  }

  state.token = data.access_token;

  history.replaceState({},document.title,location.pathname);

  document.getElementById("dash").style.display="block";
  document.getElementById("status").innerText="Conectado";
};

/* ================= API ================= */

async function api(url){
  const r = await fetch("https://api.spotify.com/v1"+url,{
    headers:{ Authorization:"Bearer "+state.token }
  });

  return r.json();
}

/* ================= RUN ================= */

async function run(range){

  state.counts = {female:0,male:0,group:0,unknown:0};

  document.getElementById("grid").innerHTML="";

  const data = await api(`/me/top/artists?limit=50&time_range=${range}`);

  for(const a of data.items){

    const g = classify(a.name);

    state.counts[g]++;

    render(a.name,g);

    update();
  }
}

/* ================= CLASSIFY ================= */

function classify(name){

  const n = name.toLowerCase();

  const f = ["billie","adele","rihanna","rosalia","dua","sza"];
  const m = ["drake","eminem","kendrick","kanye","post"];

  if(f.some(x=>n.includes(x))) return "female";
  if(m.some(x=>n.includes(x))) return "male";

  return "unknown";
}

/* ================= UI ================= */

function render(name,g){

  const el = document.getElementById("grid");

  const d = document.createElement("div");
  d.className="card";

  d.innerHTML=`
    <div>${name}</div>
    <div class="small">${g}</div>
  `;

  el.appendChild(d);
}

function update(){

  const c = state.counts;

  document.getElementById("counter").innerHTML=`
    <div>♀ ${c.female}</div>
    <div>♂ ${c.male}</div>
    <div>👥 ${c.group}</div>
    <div>? ${c.unknown}</div>
  `;
}

</script>

</body>
</html>
