<script>
// ── STATE ─────────────────────────────────────────────
const SCOPES = ['user-library-read','user-top-read','user-read-private','user-read-email'].join(' ');
const REDIRECT_URI = window.location.href.split('?')[0].split('#')[0];

let accessToken = null;

// ── INIT ──────────────────────────────────────────────
window.addEventListener('load', async () => {
  const saved = localStorage.getItem('gsp_client_id');
  if (saved) document.getElementById('clientIdInput').value = saved;

  const params = new URLSearchParams(window.location.search);
  const code = params.get('code');

  if (code) {
    await exchangeCodeForToken(code);
    window.history.replaceState({}, document.title, REDIRECT_URI);
    onLogin();
  }
});

// ── LOGIN (PKCE) ──────────────────────────────────────
async function handleLogin() {
  const clientId = document.getElementById('clientIdInput').value.trim();
  if (!clientId) {
    showError('Ingresá tu Client ID antes de continuar.');
    return;
  }

  localStorage.setItem('gsp_client_id', clientId);

  const codeVerifier = generateRandomString(64);
  const hashed = await sha256(codeVerifier);
  const codeChallenge = base64encode(hashed);

  localStorage.setItem('pkce_code_verifier', codeVerifier);

  const params = new URLSearchParams({
    client_id: clientId,
    response_type: 'code',
    redirect_uri: REDIRECT_URI,
    scope: SCOPES,
    code_challenge_method: 'S256',
    code_challenge: codeChallenge,
    show_dialog: 'true'
  });

  window.location.href = `https://accounts.spotify.com/authorize?${params}`;
}

// ── EXCHANGE CODE → TOKEN ─────────────────────────────
async function exchangeCodeForToken(code) {
  const clientId = localStorage.getItem('gsp_client_id');
  const codeVerifier = localStorage.getItem('pkce_code_verifier');

  const body = new URLSearchParams({
    client_id: clientId,
    grant_type: 'authorization_code',
    code: code,
    redirect_uri: REDIRECT_URI,
    code_verifier: codeVerifier
  });

  const res = await fetch('https://accounts.spotify.com/api/token', {
    method: 'POST',
    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
    body
  });

  const data = await res.json();

  if (!data.access_token) {
    console.error(data);
    showError('Error obteniendo access token');
    return;
  }

  accessToken = data.access_token;
}

// ── HELPERS PKCE ──────────────────────────────────────
function generateRandomString(length) {
  const possible = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
  let text = '';
  for (let i = 0; i < length; i++) {
    text += possible.charAt(Math.floor(Math.random() * possible.length));
  }
  return text;
}

async function sha256(plain) {
  const encoder = new TextEncoder();
  const data = encoder.encode(plain);
  return await crypto.subtle.digest('SHA-256', data);
}

function base64encode(buffer) {
  return btoa(String.fromCharCode(...new Uint8Array(buffer)))
    .replace(/=/g, '')
    .replace(/\+/g, '-')
    .replace(/\//g, '_');
}

// ── SPOTIFY FETCH (sin cambios) ───────────────────────
async function spotifyFetch(path, params = {}) {
  const url = new URL(`https://api.spotify.com/v1${path}`);
  Object.entries(params).forEach(([k, v]) => url.searchParams.set(k, v));
  const res = await fetch(url, {
    headers: { Authorization: `Bearer ${accessToken}` }
  });
  if (!res.ok) throw new Error(`Spotify API error: ${res.status}`);
  return res.json();
}

</script>
