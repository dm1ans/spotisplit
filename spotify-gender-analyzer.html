<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Gender Split Fast FIX</title>

<style>
body{margin:0;background:#0a0a0a;color:#eee;font-family:system-ui}
.app{max-width:900px;margin:auto;padding:30px}
button{padding:10px;margin:5px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.card{background:#111;padding:10px;border:1px solid #222}
.counter{display:flex;gap:10px;margin:10px 0;flex-wrap:wrap}
.counter div{padding:6px 10px;border:1px solid #222}
.small{font-size:12px;opacity:.7}
</style>
</head>

<body>
<div class="app">

<h2>Gender Split FIX</h2>

<input id="client" placeholder="Spotify Client ID"/>
<button onclick="login()">Login</button>

<div id="dash" style="display:none">

  <button onclick="run('short_term')">1 mes</button>
  <button onclick="run('medium_term')">6 meses</button>
  <button onclick="run('long_term')">1 año</button>

  <div class="counter" id="counter"></div>
  <div class="grid" id="grid"></div>

</div>

</div>

<script>

/* ================= STATE ================= */

const state = {
  token:null,
  cache:new Map(),
  counts:{female:0,male:0,group:0,unknown:0}
};

/* ================= CACHE ================= */

(function load(){
  try{
    const c = localStorage.getItem("cache");
    if(c) state.cache = new Map(JSON.parse(c));
  }catch{}
})();

function save(){
  localStorage.setItem("cache", JSON.stringify([...state.cache]));
}

/* ================= LOGIN ================= */

async function login(){

  const cid = document.getElementById("client").value;
  localStorage.setItem("cid",cid);

  const verifier = cryptoRandom();
  const challenge = await sha256(verifier);

  localStorage.setItem("verifier",verifier);

  const redirect = location.href.split("?")[0];

  const url =
  "https://accounts.spotify.com/authorize" +
  "?client_id=" + cid +
  "&response_type=code" +
  "&redirect_uri=" + encodeURIComponent(redirect) +
  "&scope=user-top-read user-library-read" +
  "&code_challenge_method=S256" +
  "&code_challenge=" + challenge;

  location.href = url;
}

/* ================= TOKEN EXCHANGE (FIX REAL) ================= */

window.onload = async () => {

  const code = new URLSearchParams(location.search).get("code");

  if(code){

    const cid = localStorage.getItem("cid");
    const verifier = localStorage.getItem("verifier");

    const body = new URLSearchParams({
      client_id: cid,
      grant_type: "authorization_code",
      code,
      redirect_uri: location.href.split("?")[0],
      code_verifier: verifier
    });

    const r = await fetch("https://accounts.spotify.com/api/token", {
      method:"POST",
      headers:{
        "Content-Type":"application/x-www-form-urlencoded"
      },
      body
    });

    const d = await r.json();

    if(!d.access_token){
      alert("Error login Spotify");
      console.log(d);
      return;
    }

    state.token = d.access_token;

    history.replaceState({},document.title,location.pathname);

    document.getElementById("dash").style.display="block";
  }
};

/* ================= API ================= */

async function api(url){
  const r = await fetch("https://api.spotify.com/v1"+url,{
    headers:{Authorization:"Bearer "+state.token}
  });
  return r.json();
}

/* ================= RUN ================= */

async function run(range){

  state.counts={female:0,male:0,group:0,unknown:0};

  document.getElementById("grid").innerHTML="";

  const data = await api(`/me/top/artists?limit=50&time_range=${range}`);

  await process(data.items);
}

/* ================= PROCESS ================= */

async function process(list){

  for(const a of list){

    const g = await classify(a.name);

    state.counts[g]++;

    render(a.name,g);

    update();
  }

  save();
}

/* ================= CLASSIFY ================= */

async function classify(name){

  const k = name.toLowerCase();

  if(state.cache.has(k)) return state.cache.get(k);

  let g = guess(name);

  if(g==="unknown") g = await mb(name);

  state.cache.set(k,g);

  return g;
}

/* ================= MUSICBRAINZ ================= */

async function mb(name){

  try{

    const r = await fetch(
      `https://musicbrainz.org/ws/2/artist?query=${encodeURIComponent(name)}&fmt=json&limit=1`
    );

    const d = await r.json();

    const a = d.artists?.[0];

    if(!a) return "unknown";

    if(a.type==="Group") return "group";
    if(a.gender==="female") return "female";
    if(a.gender==="male") return "male";

    return "unknown";

  }catch{
    return "unknown";
  }
}

/* ================= FAST GUESS ================= */

function guess(n){

  n = n.toLowerCase();

  const f = ["billie","adele","rihanna","rosalia","dua","sza"];
  const m = ["drake","eminem","kendrick","kanye","post","travis"];

  if(f.some(x=>n.includes(x))) return "female";
  if(m.some(x=>n.includes(x))) return "male";

  return "unknown";
}

/* ================= UI ================= */

function render(name,g){

  const el = document.getElementById("grid");

  const d = document.createElement("div");
  d.className="card";

  d.innerHTML=`
    <div>${name}</div>
    <div class="small">${g}</div>
  `;

  el.appendChild(d);
}

function update(){

  const c = state.counts;

  document.getElementById("counter").innerHTML=`
    <div>♀ ${c.female}</div>
    <div>♂ ${c.male}</div>
    <div>👥 ${c.group}</div>
    <div>? ${c.unknown}</div>
  `;
}

/* ================= HELPERS ================= */

function cryptoRandom(){
  const a = new Uint8Array(64);
  crypto.getRandomValues(a);
  return btoa(String.fromCharCode(...a));
}

async function sha256(str){
  const enc = new TextEncoder().encode(str);
  const buf = await crypto.subtle.digest("SHA-256",enc);
  return btoa(String.fromCharCode(...new Uint8Array(buf)))
    .replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}

</script>
</body>
</html>
